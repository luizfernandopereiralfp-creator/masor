services:
  masor:
    build:
      context: .
      args:
        # Públicas (publishable key + URL) — já vão no bundle do cliente, então
        # podem ter default embutido. Um .env ao lado do compose sobrescreve.
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-https://igzhwzgtxjgeaommatls.supabase.co}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlnemh3emd0eGpnZWFvbW1hdGxzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4Njc1ODMsImV4cCI6MjEwMTQ0MzU4M30.0CNd0391eP7rODf1HI3IWTSf3QMg5_IzsN8s-Wl1rG4}
    container_name: masor
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      # Públicas (default embutido; .env sobrescreve).
      - SUPABASE_URL=${SUPABASE_URL:-https://igzhwzgtxjgeaommatls.supabase.co}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlnemh3emd0eGpnZWFvbW1hdGxzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4Njc1ODMsImV4cCI6MjEwMTQ0MzU4M30.0CNd0391eP7rODf1HI3IWTSf3QMg5_IzsN8s-Wl1rG4}
      - MASOR_ANALISE_WEBHOOK_URL=${MASOR_ANALISE_WEBHOOK_URL:-https://n8n.ferpereira.com/webhook/masor-analise-fiscal}
      - NFE_TP_AMB=${NFE_TP_AMB:-1}
      # SEGREDOS — default VAZIO. Preencher via .env (deploy.sh) ou pelo editor de
      # variáveis do painel. Sem eles: o site sobe e loga; a análise da IA e a
      # captura de NF-e (SEFAZ) ficam inativas até serem preenchidos.
      - MASOR_WEBHOOK_TOKEN=${MASOR_WEBHOOK_TOKEN:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - MASOR_CERT_ENC_KEY=${MASOR_CERT_ENC_KEY:-}
      - MASOR_CHAT_WEBHOOK_URL=${MASOR_CHAT_WEBHOOK_URL:-}
      # SEFAZ: chave dos certificados A1 do Lior (MESMA da edge function cliente-certificado).
      # Sem ela, a captura de NF-e (SEFAZ) fica bloqueada.
      - CERT_MASTER_KEY=${CERT_MASTER_KEY:-}
    networks:
      - root_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.masor.rule=Host(`masor.g41one.com.br`)"
      - "traefik.http.routers.masor.entrypoints=web,websecure"
      - "traefik.http.routers.masor.tls=true"
      - "traefik.http.routers.masor.tls.certresolver=mytlschallenge"
      - "traefik.http.services.masor.loadbalancer.server.port=3000"

networks:
  root_default:
    external: true
